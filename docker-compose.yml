#      - /var/lib/docker/containers:/var/lib/docker/containers:ro
#    networks:
#      - elastic_apm

  elastic_agent_complete:
    image: elastic/elastic-agent-complete:9.4.1
    user: root
    privileged: true
    container_name: a_elastic_agent_complete
    hostname: elastic_agent_complete
    depends_on:
      - fleet
    environment:
      - FLEET_ENROLL=1
      - FLEET_URL=https://fleet:8220
      - FLEET_CA=/usr/share/elastic-agent/certificates/ca.pem
      - FLEET_ENROLLMENT_TOKEN=dm13TmQ1MEJWSjQ2SHA1VW1LSWk6alhoZHluNXc0V29sU201MldvWEZoUQ==
      - ELASTIC_AGENT_TAGS=producer,https,docker
      - KIBANA_CA=/usr/share/elastic-agent/certificates/ca.pem
    volumes:
      - ./certificates:/usr/share/elastic-agent/certificates
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - elastic_apm

  fix-permission:
    image: python:3.12-slim
    container_name: kfix-permission
    restart: "no"
    networks:
      - elastic_apm
    volumes:
      - snapshot_folder:/usr/share/elasticsearch/snapshot/share_snap
    command: >
      bash -c "
        echo RUNNING ...
        chown -R 1000:1000 /usr/share/elasticsearch/snapshot/share_snap
        echo DONE ...
      "

volumes:
  data01:
    driver: local
  data02:
    driver: local
  data03:
    driver: local
  data06:
    driver: local
  kibana_logs1:
    driver: local
  kibana_logs2:
    driver: local
  snapshot_folder:
    driver: local

networks:
  elastic_apm:
    driver: bridge
